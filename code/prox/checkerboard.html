<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calibration Checkerboard</title>
<style>
  :root { --sq: 9vmin; }
  html, body { margin: 0; height: 100%; background: #fff; color: #000; font-family: sans-serif; }
  .wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2vmin; }
  .board { display: grid; grid-template-columns: repeat(10, var(--sq)); grid-template-rows: repeat(7, var(--sq));
           border: calc(var(--sq) * 0.6) solid #fff; }
  .board div:nth-child(odd) { background: #000; }
  .board div:nth-child(even) { background: #fff; }
  p { margin: 0; font-size: 2vmin; color: #555; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <div class="board" id="b"></div>
  <p>내부 코너 9 x 6 (칸 10 x 7). 전체 화면(F11 또는 Ctrl+Cmd+F)으로 띄우고, 칸 한 변을 자로 재서 --square 에 m 단위로 입력</p>
</div>
<script>
  const b = document.getElementById("b");
  for (let r = 0; r < 7; r++) for (let c = 0; c < 10; c++) {
    const d = document.createElement("div");
    d.style.background = (r + c) % 2 === 0 ? "#000" : "#fff";
    b.appendChild(d);
  }
</script>
</body>
</html>
